<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact exercise · Stage 4</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="course-nav">
      <a href="../index.html">Live site</a>
      <a href="./index.html">Stage 4 home</a>
      <a href="./about.html">Positioning exercise</a>
      <a href="./contact.html">Contact exercise</a>
    </header>
    <p class="archive-banner">ITC First Steps · stage 4 archive.</p>

    <div class="main-wrapper">
      <div class="form-wrapper" id="form">
        <input class="form-input" type="text" id="firstName" placeholder="First Name" />
        <input class="form-input" type="text" id="lastName" placeholder="Last Name" />
        <input class="form-input" type="email" id="email" placeholder="email" />
        <input class="form-input" type="text" id="comment" placeholder="comment" />
        <div class="checkbox-wrapper">
          <input class="form-input" type="checkbox" id="accept" checked />
          <span>Agree?</span>
        </div>
        <label><input type="radio" id="radio" name="choice" /> Option</label>
        <input class="form-input" type="file" id="file" />
        <button class="form-button" id="submitButton" type="button" disabled>Submit</button>
      </div>
    </div>
    <footer class="footer">
      <p>This page was built using HTML, CSS and JavaScript (ITC First Steps stage 4).</p>
    </footer>
    <script src="./js/portfolio.js"></script>
  </body>
</html>
