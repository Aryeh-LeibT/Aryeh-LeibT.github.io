name: Site rules
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Hard rules (held pieces, sources, internal markers, private paths)
        run: python3 scripts/lint-site.py --gh
      - name: Internal link check
        run: python3 scripts/check-links.py
      - name: Printables index
        run: python3 scripts/check-printables.py
